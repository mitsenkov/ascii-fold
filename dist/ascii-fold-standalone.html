<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Fold — proteins as text and ribbon</title>
<meta name="description" content="Spinning protein structures from AlphaFold DB, drawn as ASCII text dissolving into a cartoon ribbon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root {
  --paper: #F2ECDF; --ink: #1B1A18; --mute: #8A8478;
  --red: #D33A2C; --blue: #1F63B0; --yellow: #EFB52E;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: Futura, "Century Gothic", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column;
  transition: background .3s, color .3s;
}
body.night { --paper: #121212; --ink: #F2ECDF; --mute: #77736b; }
a { color: var(--blue); }

header { display: flex; align-items: center; gap: 14px 22px; padding: 18px 24px 6px; flex-wrap: wrap; }
.id { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-width: 0; }
.mark { display: flex; gap: 4px; align-items: center; }
.mark i { display: block; width: 14px; height: 14px; }
.mark i:nth-child(1) { background: var(--red); border-radius: 50%; }
.mark i:nth-child(2) { background: var(--blue); }
.mark i:nth-child(3) { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid var(--yellow); }
h1 { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; margin: 0; font-weight: 700; }
.sub { font-size: 12px; color: var(--mute); letter-spacing: .04em; }
.loader { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.loader input {
  font: 600 13px "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase;
  width: 128px; padding: 6px 8px; border: 2px solid var(--ink); background: transparent; color: var(--ink); outline: none;
}
.loader input:focus { border-color: var(--red); }
#status { font-size: 12px; color: var(--mute); padding: 0 24px; min-height: 16px; letter-spacing: .03em; }
#status.err { color: var(--red); }

main#stage { flex: 1; min-height: 160px; position: relative; margin: 4px 0; }
main#stage.drop::after {
  content: "Drop a .pdb or .cif file"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  border: 3px dashed var(--red); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--red);
  background: color-mix(in srgb, var(--paper) 80%, transparent); z-index: 2;
}

.hint { display: flex; justify-content: space-between; gap: 16px; font-size: 11px; color: var(--mute); padding: 0 24px 4px; letter-spacing: .03em; }
footer { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; padding: 12px 24px 14px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl label { color: var(--mute); }
.ctl.off { opacity: .35; pointer-events: none; }
input[type=range] { accent-color: var(--red); width: 96px; }
.seg { display: inline-flex; border: 2px solid var(--ink); }
.seg button { font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: transparent; color: var(--ink); border: 0; padding: 5px 9px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--ink); color: var(--paper); }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.btn { font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--red); color: #fff; border: 0; padding: 7px 11px; cursor: pointer; }
.btn.alt { background: var(--blue); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); padding: 5px 9px; }
.zval { font: 600 12px "JetBrains Mono", ui-monospace, monospace; min-width: 42px; }
.legend { display: flex; gap: 12px; color: var(--mute); font-size: 11px; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; background: var(--sw); }

.shape { display: flex; flex-wrap: wrap; gap: 12px 30px; align-items: center; padding: 0 24px 18px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.shape.closed { display: none; }
.shape .grp { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.shape .gl { font-weight: 700; letter-spacing: .14em; display: inline-flex; align-items: center; gap: 7px; }
.shape .sw { display: inline-block; width: 11px; height: 11px; }
.shape .sw.h { background: var(--red); border-radius: 50%; }
.shape .sw.e { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 11px solid var(--blue); }
.shape .sw.c { background: var(--yellow); height: 4px; }

#snap { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
#snap[hidden] { display: none; }
#snap > div { text-align: center; }
#snap img { max-width: 90vw; max-height: 80vh; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
#snap p { color: #fff; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }

@media (max-width: 720px) {
  header { padding: 12px 14px 4px; gap: 8px; }
  .loader { margin-left: 0; width: 100%; }
  .loader input { flex: 1; min-width: 0; }
  #status { padding: 0 14px; font-size: 11px; }
  .hint > span:first-child { display: none; }
  .hint { padding: 0 14px 4px; }
  footer { flex-wrap: nowrap; overflow-x: auto; padding: 10px 14px 12px; gap: 18px; scrollbar-width: thin; }
  footer > * { flex: 0 0 auto; }
  .shape { flex-wrap: nowrap; overflow-x: auto; padding: 0 14px 12px; }
  .shape .grp { flex-wrap: nowrap; flex: 0 0 auto; }
}
</style>
</head>
<body>
<header>
  <div class="id">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 id="title">KRAS G12D</h1>
    <span class="sub" id="sub">PDB 6GJ8 · chain A</span>
  </div>
  <form class="loader" id="form" autocomplete="off">
    <input id="acc" placeholder="UniProt ID" spellcheck="false" aria-label="UniProt accession">
    <button class="btn" type="submit">Load</button>
    <button class="btn alt" type="button" id="rand">Random</button>
    <button class="btn ghost" type="button" id="openBtn">Open file</button>
    <input type="file" id="file" accept=".pdb,.cif,.mmcif,.ent,.gz" hidden>
  </form>
</header>
<div id="status" role="status"></div>

<main id="stage"></main>

<div class="hint"><span>Drag to rotate · Shift-drag or right-drag to pan · Scroll or pinch to zoom · Double-click to reset</span><span id="credit"></span></div>

<footer>
  <div class="ctl"><label>Zoom</label>
    <div class="seg"><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit">Fit</button><button type="button" id="zin" aria-label="Zoom in">+</button></div>
    <span id="zval" class="zval">1.0×</span>
  </div>
  <div class="ctl"><label>Detail</label>
    <div class="seg" id="detail"><button data-v="coarse">Coarse</button><button data-v="medium" class="on">Medium</button><button data-v="fine">Fine</button><button data-v="ultra">Ultra</button></div>
  </div>
  <div class="ctl"><label for="speed">Spin</label><input id="speed" type="range" min="0" max="100" value="35"></div>
  <div class="ctl"><label for="f0">Blend from</label><input id="f0" type="range" min="0" max="100" value="25"></div>
  <div class="ctl"><label for="f1">to</label><input id="f1" type="range" min="0" max="100" value="80"></div>
  <div class="ctl"><label>Layout</label>
    <div class="seg" id="layout"><button data-v="lr" class="on">Text→Ribbon</button><button data-v="rl">Ribbon→Text</button><button data-v="ascii">Text</button><button data-v="ribbon">Ribbon</button></div>
  </div>
  <div class="ctl"><label>Seam</label>
    <div class="seg" id="seam"><button data-v="dither" class="on">Dither</button><button data-v="soft">Soft</button></div>
  </div>
  <div class="ctl"><label>Colour</label>
    <div class="seg" id="colour"><button data-v="ss" class="on">SS</button><button data-v="plddt" id="plddtBtn" disabled>pLDDT</button><button data-v="mono">Ink</button></div>
  </div>
  <div class="ctl"><label>Ground</label>
    <div class="seg" id="theme"><button data-v="paper" class="on">Paper</button><button data-v="night">Night</button></div>
  </div>
  <div class="ctl"><label>Glyphs</label>
    <div class="seg" id="glyphs"><button data-v="classic" class="on">Classic</button><button data-v="blocks">Blocks</button><button data-v="geo">Geo</button></div>
  </div>
  <div class="legend" id="legend"></div>
  <button class="btn ghost" type="button" id="shapeBtn" aria-expanded="true" aria-controls="shape">Shape ▾</button>
  <button class="btn" type="button" id="png">Snapshot</button>
  <button class="btn alt" type="button" id="copy">Copy text</button>
</footer>

<section id="shape" class="shape" aria-label="Shape controls">
  <div class="grp"><span class="gl"><i class="sw h"></i>Helix</span>
    <div class="seg" id="hStyle"><button data-v="ribbon" class="on">Ribbon</button><button data-v="cylinder">Cylinder</button></div>
    <div class="ctl"><label for="hW">Width</label><input id="hW" type="range" min="50" max="250" value="135"></div>
    <div class="ctl" id="hTwrap"><label for="hT">Thickness</label><input id="hT" type="range" min="4" max="120" value="28"></div>
  </div>
  <div class="grp"><span class="gl"><i class="sw e"></i>Strand</span>
    <div class="ctl"><label for="flat">Flatten</label><input id="flat" type="range" min="0" max="100" value="60"></div>
    <div class="ctl"><label for="sW">Width</label><input id="sW" type="range" min="50" max="220" value="115"></div>
    <div class="ctl"><label for="sT">Thickness</label><input id="sT" type="range" min="2" max="80" value="14"></div>
    <div class="seg" id="arrows"><button data-v="on" class="on">Arrows</button><button data-v="off">None</button></div>
    <div class="ctl" id="headWrap"><label for="head">Head</label><input id="head" type="range" min="120" max="360" value="230"></div>
  </div>
  <div class="grp"><span class="gl"><i class="sw c"></i>Coil</span>
    <div class="ctl"><label for="coilR">Width</label><input id="coilR" type="range" min="15" max="120" value="48"></div>
    <button class="btn ghost" type="button" id="shapeReset">Reset shape</button>
  </div>
</section>

<div id="snap" hidden>
  <div><img alt="Snapshot of the current frame"><p>Right-click or long-press to save · click outside to close</p></div>
</div>
